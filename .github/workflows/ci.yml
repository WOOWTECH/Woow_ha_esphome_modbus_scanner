name: CI

on:
  push:
    branches: [main, "epic/**"]
  pull_request:
    branches: [main, "epic/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.2"
      - run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel_frontend/package-lock.json
      - run: npm ci --include=dev
        working-directory: panel_frontend
      - run: npm test
        working-directory: panel_frontend
      - run: npm run check:drift
        working-directory: panel_frontend
      - run: npx playwright install --with-deps chromium
        working-directory: panel_frontend
      - run: npm run test:browser
        working-directory: panel_frontend
      - name: Current tutorial (0.5.0)
        run: node tests/tutorial/browser_check.mjs
      - name: Historical mock-only tutorials
        run: |
          TUTORIAL_PATH=/docs/tutorial/woow-esphome-modbus-scanner-v0.1.0-zh-TW.html node tests/tutorial/browser_check.mjs
          TUTORIAL_PATH=/docs/tutorial/woow-esphome-modbus-scanner-v0.2.0-zh-TW.html node tests/tutorial/browser_check.mjs

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m compileall -q custom_components tests/live
      - name: Portable firmware invariants (not an ESPHome hardware build)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware/guanjie-scanner/scanner_test.cpp -o /tmp/scanner-state
          /tmp/scanner-state
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined firmware/guanjie-scanner/hardening_test.cpp -o /tmp/scanner-hardening
          /tmp/scanner-hardening
      - name: modbus_scanner firmware core against the bridge v2 contract (host build)
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=undefined,address firmware/tests/scanner_core_test.cpp -o /tmp/scanner-core
          /tmp/scanner-core custom_components/woow_esphome_modbus_scanner/modbus_scan/bridge_v2/contract.json
      - run: >-
          pytest --cov=custom_components/woow_esphome_modbus_scanner
          --cov-report=term-missing --cov-fail-under=90

  esphome:
    name: ESPHome config/compile (modbus_scanner example)
    runs-on: ubuntu-latest
    env:
      ESPHOME_VERSION: "2026.9.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "esphome==${ESPHOME_VERSION}"
      - name: Throwaway secrets for CI builds
        working-directory: firmware/examples
        run: |
          {
            echo 'wifi_ssid: "ci-ssid"'
            echo 'wifi_password: "ci-password"'
            echo "api_encryption_key: \"$(head -c 32 /dev/urandom | base64)\""
          } > secrets.yaml
      - name: Validate the example; only the Info sensor is disabled by default (issue #25)
        working-directory: firmware/examples
        run: |
          esphome config generic-modbus-scanner.yaml > /tmp/config.log 2>&1 || { cat /tmp/config.log; exit 1; }
          grep -A3 '    info_sensor:' /tmp/config.log | grep -F 'disabled_by_default: true' || { cat /tmp/config.log; exit 1; }
          for sensor in result_sensor lease_sensor; do
            grep -A3 "    $sensor:" /tmp/config.log | grep -F 'disabled_by_default: false' || { cat /tmp/config.log; exit 1; }
          done
          # A disabled_by_default written in YAML wins over the component's default.
          awk '{print} /^  - modbus_id: rs485$/ {print "    info_sensor:\n      name: Modbus Scanner v2 Info\n      disabled_by_default: false"}' \
            generic-modbus-scanner.yaml > info-enabled-check.yaml
          esphome config info-enabled-check.yaml > /tmp/override.log 2>&1 || { cat /tmp/override.log; exit 1; }
          grep -A3 '    info_sensor:' /tmp/override.log | grep -F 'disabled_by_default: false' || { cat /tmp/override.log; exit 1; }
      - name: Two modbus_scanner entries on one node are refused (one Bus per Gateway)
        working-directory: firmware/tests
        run: |
          if esphome config two-modbus-scanners.yaml > /tmp/two.log 2>&1; then
            cat /tmp/two.log
            echo "ESPHome unexpectedly accepted two modbus_scanner entries"; exit 1
          fi
          grep -F "A node supports only one modbus_scanner; scan a second RS-485 line with another node" /tmp/two.log || { cat /tmp/two.log; exit 1; }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}
      - name: Compile the example (codegen discovery for its one Bus)
        working-directory: firmware/examples
        run: |
          esphome compile generic-modbus-scanner.yaml
          main=.esphome/build/generic-modbus-scanner/src/main.cpp
          # The Bus gets its Pausable Poller table and its hub's serial parameters.
          grep -F 'ModbusScannerBus("rs485", 1000)' "$main"
          grep -F 'set_serial(9600, "NONE", 1)' "$main"
          grep -F 'add_poller("meter", 0x01, meter)' "$main"
          grep -F 'add_poller("inverter", 0x02, inverter)' "$main"
          test "$(grep -c 'set_bus(' "$main")" -eq 1
          grep -F '"Modbus Scanner v2 Result"' "$main"
          grep -F '"Modbus Scanner v2 Lease"' "$main"
      - name: ESPHome older than 2026.9.0 is refused with a clear message
        working-directory: firmware/examples
        run: |
          python -m venv /tmp/old-esphome
          /tmp/old-esphome/bin/pip install -q "esphome==2026.8.2"
          # Drop the example's own esphome.min_version: ESPHome checks it first and stops before
          # the component's gate runs. A user's YAML may not set min_version, so test the gate itself.
          sed '/^  min_version:/d' generic-modbus-scanner.yaml > old-esphome-check.yaml
          if grep -q 'min_version' old-esphome-check.yaml; then
            echo "min_version was not removed from the check copy"; exit 1
          fi
          if /tmp/old-esphome/bin/esphome config old-esphome-check.yaml > /tmp/old.log 2>&1; then
            cat /tmp/old.log
            echo "ESPHome 2026.8.2 unexpectedly accepted the modbus_scanner example"; exit 1
          fi
          grep -F "requires at least ESPHome version 2026.9.0" /tmp/old.log || { cat /tmp/old.log; exit 1; }
