name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.2"
      - run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel_frontend/package-lock.json
      - run: npm ci --include=dev
        working-directory: panel_frontend
      - run: npm test
        working-directory: panel_frontend
      - run: npm run check:drift
        working-directory: panel_frontend
      - run: npx playwright install --with-deps chromium
        working-directory: panel_frontend
      - run: npm run test:browser
        working-directory: panel_frontend
      - run: node tests/tutorial/browser_check.mjs
      - run: >-
          TUTORIAL_PATH=/docs/tutorial/woow-esphome-modbus-scanner-v0.2.0-zh-TW.html
          node tests/tutorial/browser_check.mjs

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m compileall -q custom_components tests/live
      - run: >-
          pytest --cov=custom_components/woow_esphome_modbus_scanner
          --cov-report=term-missing --cov-fail-under=90
