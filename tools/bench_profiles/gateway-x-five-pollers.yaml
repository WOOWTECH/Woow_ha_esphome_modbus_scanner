# #25 bench Gateway X with five Pausable Pollers (names of 12+ characters), wired through
# a USB-to-RS-485 converter to line X of tools/bench_profiles/bench-five-pollers.json.
# The Info then is about 400 characters, past Home Assistant's 255-character state limit;
# the Info sensor must come up disabled in HA and HA must log no "longer than 255" ERROR.
# Everything except the pollers is the same as gateway-x.yaml. Paths are relative to this
# file. secrets.yaml is local only, never committed.
#   esphome -s fw_version 0.5.0.dev3 run gateway-x-five-pollers.yaml
substitutions:
  components_path: ../../firmware/components
  fw_version: "0.5.0.dev3"

esphome:
  name: bench-gateway-x
  min_version: 2026.9.0
  project:
    name: woowtech.modbus_scanner
    version: ${fw_version}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key_x

ota:
  - platform: esphome

external_components:
  - source:
      type: local
      path: ${components_path}
    components: [modbus_scanner]

uart:
  id: rs485_uart
  tx_pin: GPIO32
  rx_pin: GPIO35
  baud_rate: 9600
  parity: NONE
  stop_bits: 1

modbus:
  id: rs485
  uart_id: rs485_uart
  flow_control_pin: GPIO33
  send_wait_time: 1000ms

# Pausable Pollers: each reads the simulator's counter at holding 0x0000 of its own slave
# (1-5). Gaps in a slave's reads in the simulator log are that poller's pauses.
modbus_controller:
  - id: bench_poller_01
    modbus_id: rs485
    address: 1
    update_interval: 2s
  - id: bench_poller_02
    modbus_id: rs485
    address: 2
    update_interval: 2s
  - id: bench_poller_03
    modbus_id: rs485
    address: 3
    update_interval: 2s
  - id: bench_poller_04
    modbus_id: rs485
    address: 4
    update_interval: 2s
  - id: bench_poller_05
    modbus_id: rs485
    address: 5
    update_interval: 2s

sensor:
  - platform: modbus_controller
    modbus_controller_id: bench_poller_01
    name: Bench poller 01 counter
    register_type: holding
    address: 0x0000
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: bench_poller_02
    name: Bench poller 02 counter
    register_type: holding
    address: 0x0000
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: bench_poller_03
    name: Bench poller 03 counter
    register_type: holding
    address: 0x0000
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: bench_poller_04
    name: Bench poller 04 counter
    register_type: holding
    address: 0x0000
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: bench_poller_05
    name: Bench poller 05 counter
    register_type: holding
    address: 0x0000
    value_type: U_WORD

modbus_scanner:
  - modbus_id: rs485
