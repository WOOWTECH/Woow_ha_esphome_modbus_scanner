list_gateways:
  name: List gateways
  description: Enrollment, capabilities, last health observations and caller permissions. Enrollment is not proof of connectivity.
check_gateway:
  name: Check gateway API
  description: Verify MAC, bridge signature and supported health metadata without issuing a Modbus transaction. Physical-operation authorization applies.
  fields:
    gateway_id:
      name: Physical gateway
      required: true
      selector:
        text:
get_history:
  name: Get saved scan history
  description: Return up to 20 terminal snapshots. Stored or interrupted jobs are never replayed automatically.
start_scan:
  name: Start scan
  description: Read-only best-effort discovery. Available to all active HA users and internal automations. Empty addresses normally time out.
  fields:
    provider: &provider
      name: Provider
      default: mock
      selector:
        select:
          options: [mock, esphome]
    gateway_id: &gateway
      name: Gateway
      description: Copy gateway_id from list_gateways; provider must match.
      default: mock:rs485-gateway
      selector:
        text:
    esphome_device_id: &device
      name: ESPHome device
      description: Optional additional device MAC cross-check.
      selector:
        device:
          filter:
            - integration: esphome
    start_id:
      name: Start Slave ID
      description: Physical Guanjie 1–32; mock 1–247.
      default: 1
      selector:
        number: {min: 1, max: 247, mode: box}
    end_id:
      name: End Slave ID
      description: Physical Guanjie 1–32; mock 1–247.
      default: 3
      selector:
        number: {min: 1, max: 247, mode: box}
    probe_type: &probe
      name: Probe type
      description: Physical Guanjie supports holding_register (FC03) only.
      default: holding_register
      selector:
        select:
          options: [device_identification, holding_register, input_register]
    register_address: &register
      name: Register address
      description: Physical default 25089 (0x6201); the versioned profile whitelist is enforced.
      default: 25089
      selector:
        number: {min: 0, max: 65535, mode: box}
    register_count: &count
      name: Register count
      description: Physical Guanjie requires exactly 1.
      default: 1
      selector:
        number: {min: 1, max: 125, mode: box}
    timeout_ms: &timeout
      name: Timeout
      description: Physical Guanjie requires exactly 700 ms.
      default: 700
      selector:
        number: {min: 10, max: 10000, mode: box, unit_of_measurement: ms}
    retries: &retries
      name: Retries
      description: Additional bounded attempts after a timeout.
      default: 0
      selector:
        number: {min: 0, max: 5, mode: box}
    inter_request_delay_ms: &delay
      name: Inter-request delay
      description: Cancellation-aware wait between addresses; does not remove firmware drain safeguards.
      default: 250
      selector:
        number: {min: 0, max: 5000, mode: box, unit_of_measurement: ms}
    pause_normal_polling: &pause
      name: Pause normal polling
      description: Required for physical reads; ESP owns arbitration and local restoration. No hardware effect in mock mode.
      default: true
      selector:
        boolean:
    mock_profile: &mock_profile
      name: Mock simulation profile
      description: Used only by the mock provider, never to simulate a physical response.
      default: found_default
      selector:
        select:
          options: [found_default, all_offline, partial_timeout, modbus_exception, possible_collision, gateway_disconnect]
    safety_confirmed:
      name: Confirm scan safety
      description: I understand reads temporarily pause polling, are best-effort, and prove neither absence nor Slave-ID uniqueness.
      required: true
      selector:
        boolean:
get_scan_status:
  name: Get scan status
  description: Progress, operation phase, execution budget, errors and separate recovery/cleanup evidence.
  fields:
    scan_id: &scan_id
      name: Scan ID
      required: true
      selector:
        text:
get_scan_results:
  name: Get scan results
  description: Read-only responder evidence including raw register values. Timeouts are counted, not listed as responders. Results never prove uniqueness.
  fields:
    scan_id: *scan_id
cancel_scan:
  name: Cancel scan
  description: Cooperative cancellation; an in-flight RTU frame and bounded recovery check may finish first. Physical authorization applies.
  fields:
    scan_id: *scan_id
test_address:
  name: Test address
  description: One read-only Slave-ID test. Range confirmation is implicit; physical-operation authorization still applies.
  fields:
    provider: *provider
    gateway_id: *gateway
    esphome_device_id: *device
    address:
      name: Slave ID
      description: Physical Guanjie 1–32; mock 1–247.
      default: 1
      selector:
        number: {min: 1, max: 247, mode: box}
    probe_type: *probe
    register_address: *register
    register_count: *count
    timeout_ms: *timeout
    retries: *retries
    inter_request_delay_ms: *delay
    pause_normal_polling: *pause
    mock_profile: *mock_profile
